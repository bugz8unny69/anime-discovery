name: NextGen CI
on:
  push:
    branches: [NextGen]
  pull_request:
    branches: [NextGen]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nextgen-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-stack:
    name: Offline stack (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Check source syntax
        run: |
          python -m compileall -q src/nextgen
          node --check src/nextgen/dashboard/static/dashboard.js
      - name: Run the complete NextGen offline stack
        shell: bash
        run: |
          set -o pipefail
          python -m src.nextgen.tests.run_batches 2>&1 | tee nextgen-tests.log
      - name: Preserve test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nextgen-python-${{ matrix.python }}
          path: nextgen-tests.log
          if-no-files-found: ignore
