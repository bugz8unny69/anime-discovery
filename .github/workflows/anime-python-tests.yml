# Offline Python checks. No homelab connections or deployment.
name: Anime Discovery Python tests
on:
  push:
    branches: [develop, 'feature/**', 'fix/**']
  pull_request:
    branches: [develop]
  workflow_dispatch:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python modules
        run: python -m compileall -q src/legacy
      - name: Run focused offline integration tests
        env:
          PYTHONPATH: src/legacy
        run: |
          python -m unittest -v \
            test_anime_acquisition_flow \
            test_anime_qb_submission \
            test_anime_action_reconcile \
            test_anime_acquisition_gate \
            test_anime_daemon_leases \
            test_anime_job_management \
            test_anime_series_naming \
            test_anime_acquisition_reset \
            test_anime_media_pipeline \
            test_anime_audio_verification \
            test_anime_source_cleanup \
            test_anime_safe_handlers \
            test_anime_handler_routing \
            test_anime_dispatch_audit \
            test_anime_qb_api \
            test_anime_qb_version_compat \
            test_anime_qb_manifest_intake \
            test_anime_qb_e01_probe \
            test_anime_qb_size_gate \
            test_anime_batch_completion \
            test_anime_batch_worker \
            test_anime_single_size_intake \
            test_anime_batch_identity_handoff \
            test_anime_batch_selection \
            test_anime_trial_policy \
            test_anime_trial_size_policy \
            test_anime_verified_trial \
