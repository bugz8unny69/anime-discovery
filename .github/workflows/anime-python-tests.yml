# Offline Python checks. No homelab connections or deployment.
name: Anime Discovery Python tests
on:
  push:
    branches: [develop, 'feature/**']
  pull_request:
    branches: [develop]
  workflow_dispatch:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python modules
        run: python -m compileall -q src/legacy
      - name: Run focused offline integration tests
        env:
          PYTHONPATH: src/legacy
        run: |
          python -m unittest -v \
            test_anime_acquisition_flow \
            test_anime_qb_submission \
            test_anime_action_reconcile \
            test_anime_acquisition_gate \
            test_anime_daemon_leases \
            test_anime_media_pipeline \
            test_anime_source_cleanup \
            test_anime_safe_handlers \
            test_anime_handler_routing \
            test_anime_dispatch_audit \
            test_anime_qb_api \
            test_anime_staging_rollback \
            test_anime_nfo_repair \
            test_anime_source_first \
            test_anime_media_safety \
            test_anime_shoko_probe \
            test_anime_dispatch_recovery_audit \
            test_anime_completed_snapshot \
            test_anime_staging_integrity \
            test_anime_claimed_pipeline \
            test_anime_acquisition_handler \
            test_anime_acquisition_finalize \
            test_anime_acquisition_enqueue \
            test_anime_acquisition_runtime \
            test_anime_reservation_recovery \
            test_anime_dispatch_claim_recovery \
            test_anime_acquisition_restart_integration \
            test_anime_acquisition_end_to_end \
            test_anime_shoko_contract \
            test_anime_shoko_link_plan \
            test_anime_fresh_database \
            test_anime_fresh_acquisition_integration \
            test_anime_admin_cli \
            test_anime_webhook_lifecycle \
            test_anime_web_http \
            test_anime_live_acquisition \
            test_anime_admin_upgrade \
            test_anime_shared_discovery \
            test_anime_admin_config_migration \
            test_anime_install_existing_config \
            test_anime_admin_archive_upgrade \
            test_anime_sonarr_keep \
            test_anime_notification_tvdb \
            test_anime_admin_integrations \
            test_anime_ntfy_monitor \
            test_anime_sonarr_import \
            test_anime_sonarr_finalize \
            test_anime_shoko_v3 \
            test_anime_shoko_handoff \
            test_anime_shoko_handoff_state \
            test_anime_shoko_handoff_monitor \
            test_anime_shoko_write \
            test_anime_episode_crossref \
            test_anime_shoko_integration_pipeline
